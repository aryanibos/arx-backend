name: Validate ARX Backend

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arx-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Test release-gate scripts
        run: python -m unittest discover -s tests -v

      - name: Validate repository and skill structure
        run: python scripts/validate_repo.py

      - name: Run deterministic contract evals
        run: python scripts/run_evals.py

      - name: Check canonical/plugin skill synchronization
        run: ./scripts/check-skill-sync.sh

      - name: Build deterministic skill package
        run: |
          python scripts/package_skill.py --output dist/skill.zip
          cp dist/skill.zip "$RUNNER_TEMP/skill-first.zip"
          python scripts/package_skill.py --output dist/skill.zip
          cmp "$RUNNER_TEMP/skill-first.zip" dist/skill.zip

      - name: Upload validated skill package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arx-be-skill-package-${{ runner.os }}
          path: dist/skill.zip
          if-no-files-found: error
          retention-days: 14

  reproducible-package:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: arx-be-skill-package-*

      - name: Require byte-identical packages across operating systems
        run: |
          sha256sum arx-be-skill-package-*/skill.zip
          cmp arx-be-skill-package-Linux/skill.zip arx-be-skill-package-Windows/skill.zip

  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Require tag to match release version
        run: |
          version=$(python -c "import json; print(json.load(open('plugins/arx-be/.codex-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version" >&2
            exit 1
          fi

      - name: Enforce recorded target-agent results
        run: python scripts/run_evals.py --release
